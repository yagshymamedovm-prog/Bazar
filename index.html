<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>ŞäherMarket — Şäheriň ähli dükanlary we tagamlary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f4f6fb; --card:#ffffff; --soft:#eef2f7; --dark:#0b1120; --dark2:#131c31;
      --ink:#0f172a; --sub:#64748b; --border:rgba(15,23,42,.08);
      --accent:#10b981; --accent2:#059669; --accent-soft:#ecfdf5;
      --orange:#f97316; --pink:#ec4899; --violet:#7c3aed; --danger:#ef4444;
      --grad:linear-gradient(135deg,#10b981 0%,#0d9488 50%,#0284c7 100%);
      --grad-hot:linear-gradient(135deg,#f97316 0%,#ec4899 100%);
      --r:20px; --nav-h:68px;
      --sh-sm:0 4px 14px rgba(15,23,42,.05);
      --sh-md:0 12px 30px rgba(15,23,42,.10);
      --sh-glow:0 12px 28px rgba(16,185,129,.32);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:radial-gradient(circle at top left,#1e293b,#0b1120 60%);
      color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size:14px;line-height:1.38;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font-family:inherit;color:inherit}

    .app-shell{width:100%;max-width:460px;min-height:100vh;margin:0 auto;background:var(--bg);
      display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.45)}
    .app-main{flex:1;padding:12px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px);overflow-x:hidden}
    .fade-in{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(3deg)}}
    @keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
    @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

    /* ===== TOP BAR ===== */
    .top-bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px}
    .top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .brand{display:flex;align-items:center;gap:8px;cursor:pointer}
    .brand-logo{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;
      box-shadow:0 6px 14px rgba(16,185,129,.35)}
    .brand-text{font-size:17px;font-weight:800;letter-spacing:-.5px}
    .brand-text span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .addr-pill{max-width:54%;display:flex;align-items:center;gap:6px;border:1px solid var(--border);
      background:#fff;border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;
      cursor:pointer;box-shadow:var(--sh-sm);transition:.15s}
    .addr-pill:active{transform:scale(.96)}
    .addr-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .search-box{position:relative;display:flex;align-items:center}
    .search-icon{position:absolute;left:13px;font-size:14px;color:var(--sub);pointer-events:none}
    .search-input{width:100%;height:42px;padding:0 36px 0 38px;border-radius:14px;border:1.5px solid transparent;
      background:var(--soft);font-size:13px;font-weight:600;color:var(--ink);outline:none;transition:.18s}
    .search-input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(16,185,129,.12)}
    .search-clear{position:absolute;right:8px;width:26px;height:26px;border:none;background:#e2e8f0;
      color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;display:none;align-items:center;
      justify-content:center;border-radius:50%}
    .search-clear.visible{display:flex}

    /* ===== HERO BANNER (WOW EFFECT) ===== */
    .hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px;color:#fff;
      background:radial-gradient(circle at 85% 15%,#14b8a6 0%,transparent 45%),
                 radial-gradient(circle at 15% 95%,#6366f1 0%,transparent 50%),
                 linear-gradient(135deg,#0b1120 0%,#0f172a 60%,#064e3b 100%);
      box-shadow:0 18px 38px rgba(11,17,32,.26);margin-bottom:14px}
    .hero-live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
      backdrop-filter:blur(8px);padding:5px 11px;border-radius:999px;margin-bottom:11px}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulseDot 1.6s infinite}
    .hero h1{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.18;max-width:78%;position:relative;z-index:2}
    .hero h1 span{background:linear-gradient(90deg,#34d399,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{font-size:12px;color:rgba(255,255,255,.78);margin-top:6px;max-width:76%;position:relative;z-index:2}
    .hero-floats{position:absolute;right:12px;top:18px;display:flex;flex-direction:column;gap:8px;z-index:1;pointer-events:none}
    .hf-orb{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;font-size:23px;
      animation:floaty 3.2s ease-in-out infinite}
    .hf-orb:nth-child(2){margin-left:-16px;animation-delay:.6s}
    .hf-orb:nth-child(3){animation-delay:1.2s}
    .hero-cta-row{display:flex;gap:8px;margin-top:14px;position:relative;z-index:2}
    .hero-btn{border:none;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer;
      background:#fff;color:var(--dark);box-shadow:0 6px 16px rgba(0,0,0,.18);transition:.15s}
    .hero-btn:active{transform:scale(.96)}
    .hero-btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:none}

    /* ===== BENTO MODE CARDS ===== */
    .bento-modes{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-bottom:14px}
    .bento-big{border-radius:20px;padding:14px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
      background:linear-gradient(135deg,#f97316,#ea580c 55%,#be123c);
      box-shadow:0 12px 24px rgba(234,88,12,.25);display:flex;flex-direction:column;justify-content:space-between;min-height:118px;border:none;text-align:left;transition:.15s}
    .bento-big:active,.bento-sm:active{transform:scale(.97)}
    .bento-stack{display:flex;flex-direction:column;gap:10px}
    .bento-sm{flex:1;border-radius:18px;padding:11px 13px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
      border:none;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:.15s}
    .bento-sm.market{background:linear-gradient(135deg,#10b981,#047857);box-shadow:0 10px 20px rgba(16,185,129,.22)}
    .bento-sm.shop{background:linear-gradient(135deg,#6366f1,#4338ca);box-shadow:0 10px 20px rgba(99,102,241,.22)}
    .bm-title{font-size:14.5px;font-weight:800;letter-spacing:-.2px}
    .bm-sub{font-size:10.5px;opacity:.9;font-weight:600;margin-top:2px}
    .bm-emoji{font-size:28px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .bento-big .bm-emoji{position:absolute;right:10px;bottom:8px;font-size:42px}

    /* ===== SECTION HEADS ===== */
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
    .section-title{font-size:16px;font-weight:800;letter-spacing:-.3px}
    .section-link{border:none;background:var(--accent-soft);color:var(--accent2);font-size:11.5px;font-weight:800;
      padding:5px 11px;border-radius:999px;cursor:pointer}

    /* ===== STORY-STYLE DEPTS ===== */
    .dept-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .dept-scroll::-webkit-scrollbar{display:none}
    .dept-story{min-width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:none;background:none}
    .dept-ring{width:60px;height:60px;border-radius:20px;padding:3px;display:flex;align-items:center;justify-content:center;
      background:#fff;box-shadow:var(--sh-sm);border:2px solid transparent;transition:.16s}
    .dept-story:hover .dept-ring{transform:translateY(-3px);box-shadow:var(--sh-md)}
    .dept-story:active .dept-ring{transform:scale(.92)}
    .dept-inner{width:100%;height:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
    .dept-lbl{font-size:10.5px;font-weight:700;text-align:center;color:var(--ink);line-height:1.15;max-width:74px}

    /* ===== FLASH DEALS / PRODUCTS ===== */
    .h-scroll{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
    .h-scroll::-webkit-scrollbar{display:none}
    .h-scroll .product-card{min-width:162px;max-width:162px;scroll-snap-align:start}
    .h-scroll .store-card{min-width:242px;max-width:242px;scroll-snap-align:start}

    .products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
    .product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:10px;display:flex;flex-direction:column;justify-content:space-between;gap:7px;
      box-shadow:var(--sh-sm);transition:transform .16s,box-shadow .16s;position:relative}
    .product-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
    .product-click{cursor:pointer}
    .product-thumb{height:92px;border-radius:15px;display:flex;align-items:center;justify-content:center;
      font-size:42px;user-select:none;position:relative;overflow:hidden}
    .product-thumb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 65%)}
    .product-tag{position:absolute;top:7px;left:7px;z-index:2;font-size:9.5px;font-weight:800;padding:3px 7px;
      border-radius:999px;background:var(--grad-hot);color:#fff;box-shadow:0 3px 8px rgba(236,72,153,.3)}
    .product-source{font-size:10px;font-weight:700;color:var(--sub);margin-top:6px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .product-title{font-size:13px;font-weight:800;line-height:1.25;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px;margin-top:3px}
    .product-unit{font-size:11px;color:var(--sub);font-weight:600}
    .product-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:3px}
    .price-col{display:flex;flex-direction:column}
    .old-price{font-size:10px;color:var(--sub);text-decoration:line-through;font-weight:600}
    .product-price{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
    .add-btn{width:36px;height:36px;border-radius:12px;border:none;background:var(--dark);color:#fff;
      font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:.14s;box-shadow:0 4px 12px rgba(15,23,42,.2)}
    .add-btn:hover{background:var(--accent2)}
    .add-btn:active{transform:scale(.88)}
    .stepper{display:inline-flex;align-items:center;background:var(--dark);color:#fff;
      border-radius:12px;height:36px;padding:0 3px;gap:2px;flex-shrink:0}
    .step-btn{width:28px;height:28px;border:none;border-radius:9px;background:rgba(255,255,255,.14);color:#fff;
      font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .step-btn.plus{background:var(--accent)}
    .step-qty{min-width:20px;text-align:center;font-size:12.5px;font-weight:800}

    /* ===== STORE CARDS ===== */
    .stores-grid{display:grid;grid-template-columns:1fr;gap:11px}
    .store-card{background:var(--card);border:1px solid var(--border);border-radius:22px;
      overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--sh-sm);
      transition:transform .16s,box-shadow .16s;display:flex;flex-direction:column;position:relative}
    .store-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
    .store-card:active{transform:scale(.98)}
    .sc-cover{height:76px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px}
    .sc-emoji{width:48px;height:48px;border-radius:16px;background:#fff;box-shadow:0 8px 18px rgba(15,23,42,.12);
      display:flex;align-items:center;justify-content:center;font-size:25px;transform:translateY(18px)}
    .sc-top-right{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px}
    .sc-status{font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.94);color:#059669;
      display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .sc-status.closed{color:#dc2626}
    .fav-btn{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.94);
      display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.1);transition:.14s}
    .fav-btn:active{transform:scale(.82)}
    .sc-body{padding:22px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
    .sc-head-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .sc-name{font-size:15px;font-weight:800;letter-spacing:-.2px}
    .sc-rating{font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;padding:3px 8px;border-radius:999px;white-space:nowrap}
    .sc-desc{font-size:11.5px;color:var(--sub);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .sc-foot{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;font-weight:700;color:var(--sub);flex-wrap:wrap}
    .sc-pill{padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}

    /* ===== FILTER CHIPS & SUB HEADER ===== */
    .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 13px;
      font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;cursor:pointer;flex-shrink:0;transition:.15s}
    .chip.active{background:var(--dark);border-color:var(--dark);color:#fff}

    .sub-header{background:#fff;border:1px solid var(--border);border-radius:18px;
      padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-sm)}
    .back-btn{border:none;background:var(--soft);font-size:12px;font-weight:800;
      padding:8px 12px;border-radius:12px;cursor:pointer;flex-shrink:0}
    .sub-title-wrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
    .sub-title{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* ===== STORE HERO ===== */
    .store-hero{background:#fff;border:1px solid var(--border);border-radius:24px;
      overflow:hidden;box-shadow:var(--sh-sm);margin-bottom:12px;position:relative}
    .sh-cover{height:100px;padding:12px;display:flex;align-items:flex-start;justify-content:space-between}
    .sh-avatar{position:absolute;left:16px;top:66px;width:64px;height:64px;border-radius:20px;background:#fff;
      box-shadow:var(--sh-md);display:flex;align-items:center;justify-content:center;font-size:34px}
    .sh-body{padding:40px 16px 16px;display:flex;flex-direction:column;gap:7px}
    .sh-name{font-size:20px;font-weight:800;letter-spacing:-.4px}
    .sh-stats{display:flex;flex-wrap:wrap;gap:6px}
    .sh-stat{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft)}
    .sh-stat.open{background:#dcfce7;color:#15803d}
    .sh-stat.closed{background:#fee2e2;color:#dc2626}
    .store-search{width:100%;height:40px;padding:0 14px;border-radius:13px;border:1.5px solid var(--border);
      background:#fff;font-size:13px;font-weight:600;outline:none;margin-bottom:10px}
    .store-search:focus{border-color:var(--accent)}

    /* ===== FLOATING CART ===== */
    .float-cart{position:fixed;left:50%;transform:translateX(-50%);
      bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
      width:calc(100% - 28px);max-width:432px;z-index:29;
      background:var(--dark);color:#fff;border:none;border-radius:18px;padding:13px 16px;
      display:none;align-items:center;justify-content:space-between;gap:10px;
      box-shadow:0 14px 30px rgba(11,17,32,.36);cursor:pointer;transition:.16s}
    .float-cart.visible{display:flex;animation:rise .25s ease}
    .float-cart:active{transform:translateX(-50%) scale(.97)}
    .fc-badge{background:var(--accent);color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}

    /* ===== CART & CHECKOUT ===== */
    .cart-group{background:#fff;border:1px solid var(--border);border-radius:20px;
      overflow:hidden;box-shadow:var(--sh-sm);margin-bottom:12px}
    .cg-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--border);cursor:pointer}
    .cg-emoji{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
    .cg-name{flex:1;font-size:14px;font-weight:800}
    .cart-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--soft)}
    .cart-item:last-of-type{border-bottom:none}
    .cart-emoji{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
    .cart-info{flex:1;min-width:0}
    .cart-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cart-price-line{font-size:11.5px;color:var(--sub);margin-top:2px}
    .cg-foot{padding:10px 14px 12px}
    .cg-order-btn{width:100%;border:none;background:var(--accent-soft);color:var(--accent2);
      border-radius:12px;padding:10px;font-size:12.5px;font-weight:800;cursor:pointer}

    .summary-card,.form-card{background:#fff;border:1px solid var(--border);border-radius:22px;
      padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh-sm);margin-bottom:12px}
    .summary-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
    .summary-total{font-size:21px;font-weight:800;letter-spacing:-.4px}
    .checkout-btn{width:100%;height:50px;border:none;border-radius:15px;background:var(--grad);color:#fff;
      font-size:14.5px;font-weight:800;cursor:pointer;box-shadow:var(--sh-glow);transition:.15s}
    .checkout-btn:active{transform:scale(.98)}

    .field label{font-size:12px;font-weight:800;margin-bottom:6px;display:block}
    .field input,.field textarea,.field select{width:100%;border:1.5px solid var(--border);border-radius:13px;
      background:#f8fafc;padding:12px;font-size:14px;font-weight:600;outline:none;transition:.15s}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:#fff}
    .field .err{display:none;font-size:11px;color:var(--danger);margin-top:4px;font-weight:700}
    .field.invalid input,.field.invalid textarea{border-color:var(--danger)}
    .field.invalid .err{display:block}
    .pay-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .pay-opt{border:1.5px solid var(--border);background:#f8fafc;border-radius:13px;padding:11px 8px;
      font-size:12.5px;font-weight:800;cursor:pointer;text-align:center}
    .pay-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent2)}

    /* ===== LIVE ORDER TRACKING CARDS ===== */
    .order-card{background:#fff;border:1px solid var(--border);border-radius:22px;
      padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;box-shadow:var(--sh-sm)}
    .order-head{display:flex;align-items:center;gap:10px}
    .order-emoji{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px}
    .order-status-pill{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
    .st-new{background:#dbeafe;color:#1d4ed8}
    .st-accepted{background:#fef3c7;color:#b45309}
    .st-preparing{background:#ffedd5;color:#c2410c}

    .track-seg.done{background:var(--accent)}
    .track-seg.active{background:var(--orange)}
    .order-items-box{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--ink);line-height:1.45}

    .oa-btn.dark{background:var(--dark);color:#fff;border-color:var(--dark)}

    /* ===== BOTTOM NAV ===== */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
      background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:35}
    .nav-btn{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:4px;cursor:pointer;color:var(--sub);font-size:10px;font-weight:700}
    .nav-btn.active{color:var(--dark)}
    .nav-icon-wrap{position:relative;font-size:20px;line-height:1;transition:.15s}
    .nav-btn.active .nav-icon-wrap{transform:translateY(-2px)}
    .nav-badge{position:absolute;top:-6px;right:-11px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
      background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}
    .nav-badge.visible{display:flex;animation:pop .25s ease}

    /* ===== SHEETS & EMPTY & TOAST ===== */
    .sheet-overlay{position:fixed;inset:0;background:rgba(11,17,32,.6);backdrop-filter:blur(4px);
      display:none;align-items:flex-end;justify-content:center;z-index:60}
    .sheet-overlay.open{display:flex}
    .sheet-card{width:100%;max-width:460px;background:#fff;border-radius:26px 26px 0 0;
      padding:12px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;
      max-height:88vh;overflow:auto;animation:rise .24s ease}
    .sheet-handle{width:44px;height:5px;border-radius:999px;background:#e2e8f0;margin:0 auto 4px}
    .pd-thumb{height:148px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:72px}
    .empty-box{background:#fff;border:1px solid var(--border);border-radius:22px;padding:34px 18px;
      text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:var(--sh-sm)}

    .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);

      // ============================================================
      // 3. UMUMY BAZA (Local Sync + Supabase taýýar)
      // ============================================================
      const DB_STORES_KEY   = 'sm_db_stores_v1';
      const DB_PRODUCTS_KEY = 'sm_db_products_v1';
      const DB_ORDERS_KEY   = 'sm_db_orders_v1';
      const CART_KEY        = 'sm_client_cart_v1';
      const CUSTOMER_KEY    = 'sm_client_profile_v1';
      const FAV_KEY         = 'sm_client_favs_v1';
      const MY_CODES_KEY    = 'sm_client_mycodes_v1';

      function loadJSON(k, f) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch { return f; } }
      function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

      // Ilkinji gezek açylanda başlangyç maglumatlary ýaz
      if (!localStorage.getItem(DB_STORES_KEY)) saveJSON(DB_STORES_KEY, DEFAULT_STORES);
      if (!localStorage.getItem(DB_PRODUCTS_KEY)) saveJSON(DB_PRODUCTS_KEY, DEFAULT_PRODUCTS);
      if (!localStorage.getItem(DB_ORDERS_KEY)) saveJSON(DB_ORDERS_KEY, []);

      let STORES = loadJSON(DB_STORES_KEY, DEFAULT_STORES);
      let PRODUCTS = loadJSON(DB_PRODUCTS_KEY, DEFAULT_PRODUCTS);
      let ALL_ORDERS = loadJSON(DB_ORDERS_KEY, []);

      const DEPT_BY_ID = Object.fromEntries(DEPTS.map(d => [d.id, d]));
      let STORE_BY_ID = {};
      let PRODUCT_BY_ID = {};
      function rebuildIndexes() {
        STORE_BY_ID = Object.fromEntries(STORES.map(s => [s.id, s]));
        PRODUCT_BY_ID = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
      }
      rebuildIndexes();

      const state = {
        view: 'home', activeId: null, searchQuery: '',
        storeTypeFilter: 'all', storeFilter: 'all',
        storeCatFilter: 'all', storeSearch: '',
        checkoutStoreId: null, payMethod: 'cash',
        cart: loadJSON(CART_KEY, {}),
        customer: loadJSON(CUSTOMER_KEY, {}),
        favs: loadJSON(FAV_KEY, []),
        myOrderCodes: loadJSON(MY_CODES_KEY, []),
        activeProductId: null
      };
      let stack = [];

      const STATUS_META = {
        new:       { label:'Täze sargyt',   cls:'st-new',       step:1 },
        accepted:  { label:'Kabul edildi',  cls:'st-accepted',  step:2 },
        preparing: { label:'Taýýarlanýar',  cls:'st-preparing', step:2 },
        onway:     { label:'Kurýer ýolda',  cls:'st-onway',     step:3 },
        delivered: { label:'Eltildi ✓',     cls:'st-delivered', step:4 },
        cancelled: { label:'Ýatyryldy',     cls:'st-cancelled', step:0 }
      };

      const $ = id => document.getElementById(id);
      function fmt(v) { return Number(v).toLocaleString('tr-TR') + ' ' + CONFIG.currency; }
      function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

      let toastTimer;
      function toast(msg) {
        const t = $('toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
      }

      // Live sync with dukan.html (same browser tabs)
      window.addEventListener('storage', e => {
        if (e.key === DB_STORES_KEY || e.key === DB_PRODUCTS_KEY || e.key === DB_ORDERS_KEY) {
          STORES = loadJSON(DB_STORES_KEY, DEFAULT_STORES);
          PRODUCTS = loadJSON(DB_PRODUCTS_KEY, DEFAULT_PRODUCTS);
          ALL_ORDERS = loadJSON(DB_ORDERS_KEY, []);
          rebuildIndexes();
          renderView(false);
          if (e.key === DB_ORDERS_KEY) toast('Sargyt ýagdaýy täzelendi 🔔');
        }
      });

      async function syncFromSupabase() {
        if (!sb) return;
        try {
          const [sRes, pRes] = await Promise.all([
            sb.from('stores').select('*'),
            sb.from('products').select('*')
          ]);
          if (sRes.data && sRes.data.length) STORES = sRes.data;
          if (pRes.data && pRes.data.length) PRODUCTS = pRes.data;
          if (state.myOrderCodes.length) {
            const oRes = await sb.from('orders').select('*').in('code', state.myOrderCodes).order('created_at', { ascending:false });
            if (oRes.data) ALL_ORDERS = oRes.data;
          }
          rebuildIndexes();
          renderView(false);
        } catch (err) { console.warn('Supabase sync:', err); }
      }

      function cartSummary() {
        let count = 0, total = 0;
        for (const id in state.cart) {
          const q = state.cart[id], p = PRODUCT_BY_ID[id];
          if (q > 0 && p && p.inStock !== false) { count += q; total += p.price * q; }
        }
        return { count, total };
      }

      function cartGroups(scopeId) {
        const groups = [];
        STORES.forEach(s => {
          if (scopeId && s.id !== scopeId) return;
          const items = []; let count = 0, total = 0;
          for (const id in state.cart) {
            const p = PRODUCT_BY_ID[id], q = state.cart[id];
            if (p && q > 0 && p.storeId === s.id) { items.push({ p, qty: q }); count += q; total += p.price * q; }
          }
          if (items.length) groups.push({ store: s, items, count, total });
        });
        return groups;
      }

      function updateQty(id, delta) {
        const p = PRODUCT_BY_ID[id];
        if (!p || p.inStock === false) { toast('Bu haryt häzir gutardy'); return; }
        let next = (state.cart[id] || 0) + delta;
        if (next > 99) next = 99;
        if (next <= 0) delete state.cart[id]; else state.cart[id] = next;
        saveJSON(CART_KEY, state.cart);
        renderBottomNav(); renderView(false);
        if (state.activeProductId === id && $('productSheet').classList.contains('open')) renderProductSheet(id);
      }

      function toggleFav(storeId) {
        if (state.favs.includes(storeId)) { state.favs = state.favs.filter(x => x !== storeId); toast('Halananlardan aýryldy'); }
        else { state.favs.push(storeId); toast('Halananlara goşuldy ❤️'); }
        saveJSON(FAV_KEY, state.favs);
        renderView(false);
      }

      function setView(v, id) {
        state.view = v; state.activeId = id || null;
        if (v === 'store') { state.storeCatFilter = 'all'; state.storeSearch = ''; }
        if (v !== 'search' && state.searchQuery) { state.searchQuery = ''; $('searchInput').value = ''; $('searchClearBtn').classList.remove('visible'); }
        renderBottomNav(); renderView(true);
      }
      function go(v, id) { stack.push({ v: state.view, id: state.activeId }); setView(v, id); }
      function back() { const p = stack.pop(); if (p) setView(p.v, p.id); else setView('home'); }
      function goTab(tab) { stack = []; state.checkoutStoreId = null; setView(tab); }

      function updateTopAddr() {
        $('topAddrText').textContent = state.customer.address || 'Salgyňyzy saýlaň';
      }

      // ============================================================
      // 4. UI KARTLAR
      // ============================================================
      function storeCardHtml(s) {
        const n = PRODUCTS.filter(p => p.storeId === s.id && p.inStock !== false).length;
        const fav = state.favs.includes(s.id);
        const openBadge = s.isOpen !== false
          ? '<span class="sc-status"><span class="live-dot" style="width:6px;height:6px;"></span>Açyk</span>'
          : '<span class="sc-status closed">● Ýapyk</span>';
        return '<div class="store-card" data-open-store="' + s.id + '">' +
          '<div class="sc-cover" style="background:' + (s.grad || 'var(--grad)') + ';">' +
            '<span class="sc-emoji">' + s.emoji + '</span>' +
            '<div class="sc-top-right">' + openBadge +
              '<button type="button" class="fav-btn" data-fav="' + s.id + '">' + (fav ? '❤️' : '🤍') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="sc-body">' +
            '<div class="sc-head-line"><div class="sc-name">' + esc(s.name) + '</div><span class="sc-rating">★ ' + esc(s.rating || '4.8') + '</span></div>' +
            '<div class="sc-desc">' + esc(s.desc) + '</div>' +
            '<div class="sc-foot">' +
              '<span class="sc-pill">🚚 ' + esc(s.eta) + '</span>' +
              '<span class="sc-pill">Mugt eltip bermek</span>' +
              '<span>' + n + ' haryt</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      function productCardHtml(p, showStore) {
        const st = STORE_BY_ID[p.storeId] || { emoji:'🏪', name:'Dükan', soft:'#f1f5f9' };
        const qty = state.cart[p.id] || 0;
        const disc = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
        const tag = disc > 0 ? '<span class="product-tag">-' + disc + '%</span>' : '';
        const src = showStore ? '<div class="product-source">' + st.emoji + ' ' + esc(st.name) + '</div>' : '';
        const ctrl = p.inStock === false
          ? '<span style="font-size:10.5px;font-weight:800;color:var(--danger);">Gutardy</span>'
          : (qty === 0
            ? '<button type="button" class="add-btn" data-add="' + p.id + '">+</button>'
            : '<div class="stepper"><button type="button" class="step-btn" data-dec="' + p.id + '">−</button><span class="step-qty">' + qty + '</span><button type="button" class="step-btn plus" data-inc="' + p.id + '">+</button></div>');

        return '<article class="product-card">' +
          '<div class="product-click" data-open-prod="' + p.id + '">' +
            '<div class="product-thumb" style="background:linear-gradient(155deg,' + st.soft + ',#f8fafc);">' + tag + p.emoji + '</div>' +
            src +
            '<div class="product-title">' + esc(p.title) + '</div>' +
            '<div class="product-unit">' + esc(p.unit) + '</div>' +
          '</div>' +
          '<div class="product-bottom">' +
            '<div class="price-col">' + (p.oldPrice ? '<span class="old-price">' + fmt(p.oldPrice) + '</span>' : '') + '<div class="product-price">' + fmt(p.price) + '</div></div>' +
            ctrl +
          '</div>' +
        '</article>';
      }

      // ============================================================
      // 5. SAHYPALAR
      // ============================================================
      function renderHome() {
        const openCount = STORES.filter(s => s.isOpen !== false).length;
        const deals = PRODUCTS.filter(p => p.deal && p.inStock !== false);
        const foodStores = STORES.filter(s => s.type === 'food');
        const otherStores = STORES.filter(s => s.type !== 'food');

        const deptStories = DEPTS.map(d =>
          '<button type="button" class="dept-story" data-open-dept="' + d.id + '">' +
            '<div class="dept-ring" style="border-color:' + d.soft + ';"><div class="dept-inner" style="background:' + d.soft + ';">' + d.emoji + '</div></div>' +
            '<span class="dept-lbl">' + esc(d.name) + '</span>' +
          '</button>'
        ).join('');

        return '<div class="fade-in">' +
          '<div class="hero">' +
            '<div class="hero-live"><span class="live-dot"></span>' + openCount + ' dükan we naharhana häzir açyk</div>' +
            '<h1>Şäheriň ähli zady — <span>bir basyşda</span></h1>' +
            '<p>Gyzgyn tagamlar, marketler, güller we şäher dükanlary göni gapyňyzda.</p>' +
            '<div class="hero-floats"><div class="hf-orb">🍕</div><div class="hf-orb">🛒</div><div class="hf-orb">💐</div></div>' +
            '<div class="hero-cta-row">' +
              '<button type="button" class="hero-btn" data-open-type="food">Tagam sargyt et</button>' +
              '<button type="button" class="hero-btn ghost" data-go-stores="true">Ähli dükanlar →</button>' +
            '</div>' +
          '</div>' +

          '<div class="bento-modes">' +
            '<button type="button" class="bento-big" data-open-type="food">' +
              '<div><div class="bm-title">Gyzgyn tagamlar</div><div class="bm-sub">Palaw, pizza, somsa • 25 min</div></div>' +
              '<div class="bm-sub" style="font-weight:800;opacity:1;">Seret →</div>' +
              '<span class="bm-emoji">🍽️</span>' +
            '</button>' +
            '<div class="bento-stack">' +
              '<button type="button" class="bento-sm market" data-open-type="market"><div><div class="bm-title">Marketler</div><div class="bm-sub">Azyk, et, suw</div></div><span class="bm-emoji">🛒</span></button>' +
              '<button type="button" class="bento-sm shop" data-open-type="shop"><div><div class="bm-title">Şäher dükanlary</div><div class="bm-sub">Tehno, gül, hojalyk</div></div><span class="bm-emoji">✨</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="section-head"><h2 class="section-title">Bölümler</h2></div>' +
          '<div class="dept-scroll">' + deptStories + '</div>' +

          '<div class="section-head"><h2 class="section-title">🔥 Şu günki arzanladyşlar</h2><span style="font-size:11px;font-weight:800;color:var(--pink);">Tiz al</span></div>' +
          '<div class="h-scroll">' + deals.map(p => productCardHtml(p, true)).join('') + '</div>' +

          '<div class="section-head"><h2 class="section-title">🍽️ Naharhanalar</h2><button type="button" class="section-link" data-open-type="food">Ählisi</button></div>' +
          '<div class="h-scroll">' + foodStores.map(storeCardHtml).join('') + '</div>' +

          '<div class="section-head"><h2 class="section-title">🏪 Marketler we dükanlar</h2><button type="button" class="section-link" data-go-stores="true">Ählisi</button></div>' +
          '<div class="stores-grid">' + otherStores.slice(0, 6).map(storeCardHtml).join('') + '</div>' +

          '<div class="partner-hint">Dükan eýesimiňiz? <a href="dukan.html">Dükan paneline giriň →</a></div>' +
        '</div>';
      }

      function renderStoresTab() {
        const types = [
          { id:'all', label:'Ählisi' },
          { id:'food', label:'🍽️ Tagamlar' },
          { id:'market', label:'🛒 Marketler' },
          { id:'shop', label:'✨ Dükanlar' }
        ].map(t => '<button type="button" class="chip' + (state.storeTypeFilter === t.id ? ' active' : '') + '" data-type-filter="' + t.id + '">' + t.label + '</button>').join('');

        const depts = '<button type="button" class="chip' + (state.storeFilter === 'all' ? ' active' : '') + '" data-filter="all">Ähli bölümler</button>' +
          DEPTS.map(d => '<button type="button" class="chip' + (state.storeFilter === d.id ? ' active' : '') + '" data-filter="' + d.id + '">' + d.emoji + ' ' + esc(d.name) + '</button>').join('');

        let list = STORES;
        if (state.storeTypeFilter !== 'all') list = list.filter(s => s.type === state.storeTypeFilter);
        if (state.storeFilter !== 'all') list = list.filter(s => (s.cats || []).includes(state.storeFilter));

        return '<div class="fade-in">' +
          '<div class="section-head" style="margin-top:2px;"><h2 class="section-title">Dükanlar we naharhanalar</h2><span style="font-size:12px;color:var(--sub);font-weight:700;">' + list.length + ' ýer</span></div>' +
          '<div class="chips">' + types + '</div>' +
          '<div class="chips">' + depts + '</div>' +
          (list.length ? '<div class="stores-grid">' + list.map(storeCardHtml).join('') + '</div>'
            : '<div class="empty-box"><div style="font-size:36px;">🏪</div><strong>Bu filtrde dükan ýok</strong><button type="button" class="primary-small-btn" data-reset-filters="true">Ählisini görkez</button></div>') +
        '</div>';
      }

      function renderDept() {
        const d = DEPT_BY_ID[state.activeId];
        if (!d) return renderHome();
        const list = STORES.filter(s => (s.cats || []).includes(d.id));
        return '<div class="fade-in">' +
          '<div class="sub-header"><button type="button" class="back-btn" data-back="true">← Yza</button><div class="sub-title-wrap"><span style="font-size:20px;">' + d.emoji + '</span><span class="sub-title">' + esc(d.name) + '</span></div></div>' +
          '<div class="stores-grid">' + list.map(storeCardHtml).join('') + '</div>' +
        '</div>';
      }

      function renderStore() {
        const s = STORE_BY_ID[state.activeId];
        if (!s) return renderHome();
        const allItems = PRODUCTS.filter(p => p.storeId === s.id);
        const cats = [...new Set(allItems.map(p => p.cat).filter(Boolean))];
        const fav = state.favs.includes(s.id);

        let items = allItems;
        if (state.storeCatFilter !== 'all') items = items.filter(p => p.cat === state.storeCatFilter);
        if (state.storeSearch.trim()) {
          const sq = state.storeSearch.trim().toLowerCase();
          items = items.filter(p => (p.title + ' ' + (p.desc || '')).toLowerCase().includes(sq));
        }

        return '<div class="fade-in">' +
          '<div class="store-hero">' +
            '<div class="sh-cover" style="background:' + (s.grad || 'var(--grad)') + ';">' +
              '<button type="button" class="back-btn" style="background:rgba(255,255,255,.92);" data-back="true">← Yza</button>' +
              '<button type="button" class="fav-btn" data-fav="' + s.id + '" style="width:36px;height:36px;font-size:17px;">' + (fav ? '❤️' : '🤍') + '</button>' +
            '</div>' +
            '<div class="sh-avatar">' + s.emoji + '</div>' +
            '<div class="sh-body">' +
              '<div class="sh-name">' + esc(s.name) + '</div>' +
              '<div style="font-size:12.5px;color:var(--sub);">' + esc(s.desc) + '</div>' +
              '<div class="sh-stats">' +
                '<span class="sh-stat ' + (s.isOpen !== false ? 'open' : 'closed') + '">' + (s.isOpen !== false ? '● Açyk (' + esc(s.hours) + ')' : '● Häzir ýapyk') + '</span>' +
                '<span class="sh-stat">★ ' + esc(s.rating) + '</span>' +
                '<span class="sh-stat">🚚 ' + esc(s.eta) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<input type="text" class="store-search" id="storeSearchInput" placeholder="Şu dükanyň içinde gözle..." value="' + esc(state.storeSearch) + '" />' +
          (cats.length > 1 ? '<div class="chips"><button type="button" class="chip' + (state.storeCatFilter === 'all' ? ' active' : '') + '" data-store-cat="all">Ählisi</button>' + cats.map(c => '<button type="button" class="chip' + (state.storeCatFilter === c ? ' active' : '') + '" data-store-cat="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' : '') +
          (items.length ? '<div class="products-grid">' + items.map(p => productCardHtml(p, false)).join('') + '</div>'
            : '<div class="empty-box"><div>🔍</div><strong>Haryt tapylmady</strong></div>') +
        '</div>';
      }

      function renderFavorites() {
        const list = STORES.filter(s => state.favs.includes(s.id));
        if (!list.length) return '<div class="empty-box fade-in"><div style="font-size:40px;">❤️</div><strong>Halanan dükan ýok</strong><p style="font-size:12.5px;color:var(--sub);">Söýgüli dükanlaryňyzyň ýürekjigine basyp şu ýerde saklaň.</p><button type="button" class="primary-small-btn" data-go-stores="true">Dükanlara seret</button></div>';
        return '<div class="fade-in"><div class="section-head" style="margin-top:2px;"><h2 class="section-title">Halanan dükanlar</h2></div><div class="stores-grid">' + list.map(storeCardHtml).join('') + '</div></div>';
      }

      function renderSearch() {
        const q = state.searchQuery.trim().toLowerCase();
        const fs = STORES.filter(s => (s.name + ' ' + s.desc).toLowerCase().includes(q));
        const fp = PRODUCTS.filter(p => (p.title + ' ' + (p.desc || '')).toLowerCase().includes(q));
        let body = '';
        if (fs.length) body += '<div class="section-head" style="margin-top:2px;"><h2 class="section-title">Dükanlar</h2></div><div class="stores-grid">' + fs.map(storeCardHtml).join('') + '</div>';
        if (fp.length) body += '<div class="section-head"><h2 class="section-title">Harytlar we tagamlar</h2></div><div class="products-grid">' + fp.map(p => productCardHtml(p, true)).join('') + '</div>';
        if (!fs.length && !fp.length) body = '<div class="empty-box"><div style="font-size:38px;">🔍</div><strong>Hiç zat tapylmady</strong><p style="font-size:12.5px;color:var(--sub);">Palaw, pizza, süt, bägül ýa-da powerbank ýazyp görüň.</p></div>';
        return '<div class="fade-in"><div class="sub-header"><button type="button" class="back-btn" data-back="true">← Yza</button><div class="sub-title-wrap"><span class="sub-title">«' + esc(state.searchQuery.trim()) + '»</span></div></div>' + body + '</div>';
      }

      function renderCart() {
        const groups = cartGroups(null);
        const sum = cartSummary();
        if (!groups.length) return '<div class="empty-box fade-in"><div style="font-size:44px;">🛒</div><strong>Sebediňiz boş</strong><p style="font-size:12.5px;color:var(--sub);">Tagamlardan we dükanlardan islän zadyňyzy goşuň.</p><button type="button" class="primary-small-btn" data-go-stores="true">Dükanlara geç</button></div>';

        return '<div class="fade-in">' +
          '<div class="section-head" style="margin-top:2px;"><h2 class="section-title">Sebet (' + sum.count + ')</h2><button type="button" style="border:none;background:none;color:var(--danger);font-weight:800;font-size:12px;cursor:pointer;" data-cart-clear="true">Boşat ✕</button></div>' +
          groups.map(g =>
            '<div class="cart-group">' +
              '<div class="cg-head" data-open-store="' + g.store.id + '"><span class="cg-emoji" style="background:' + g.store.soft + ';">' + g.store.emoji + '</span><span class="cg-name">' + esc(g.store.name) + '</span><strong>' + fmt(g.total) + '</strong></div>' +
              g.items.map(it =>
                '<div class="cart-item">' +
                  '<div class="cart-emoji" style="background:' + g.store.soft + ';">' + it.p.emoji + '</div>' +
                  '<div class="cart-info"><div class="cart-title">' + esc(it.p.title) + '</div><div class="cart-price-line">' + esc(it.p.unit) + ' • <strong>' + fmt(it.p.price * it.qty) + '</strong></div></div>' +
                  '<div class="stepper"><button type="button" class="step-btn" data-dec="' + it.p.id + '">−</button><span class="step-qty">' + it.qty + '</span><button type="button" class="step-btn plus" data-inc="' + it.p.id + '">+</button></div>' +
                '</div>'
              ).join('') +
              (groups.length > 1 ? '<div class="cg-foot"><button type="button" class="cg-order-btn" data-checkout-store="' + g.store.id + '">Diňe şu dükany sargyt et →</button></div>' : '') +
            '</div>'
          ).join('') +
          '<div class="summary-card">' +
            '<div class="summary-row"><span>Eltip bermek</span><span style="color:var(--accent2);font-weight:800;">Mugt</span></div>' +
            '<div class="summary-row"><span>Umumy jemi</span><span class="summary-total">' + fmt(sum.total) + '</span></div>' +
            '<button type="button" class="checkout-btn" data-checkout-all="true">' + (groups.length > 1 ? 'Ählisini onlaýn sargyt et (' + groups.length + ' dükan) →' : 'Onlaýn sargyt et →') + '</button>' +
            '<p style="font-size:11px;color:var(--sub);text-align:center;">Her dükanyň sargydy awtomatiki diňe şol dükanyň paneline düşýär.</p>' +
          '</div>' +
        '</div>';
      }

      function renderCheckout() {
        const groups = cartGroups(state.checkoutStoreId);
        if (!groups.length) return renderCart();
        const c = state.customer || {};
        const totalSum = groups.reduce((a, g) => a + g.total, 0);

        return '<div class="fade-in">' +
          '<div class="sub-header"><button type="button" class="back-btn" data-back="true">← Yza</button><div class="sub-title-wrap"><span class="sub-title">Sargydy tassykla</span></div></div>' +
          '<div class="summary-card">' +
            groups.map(g => '<div style="font-size:12.5px;font-weight:800;color:var(--accent2);">' + g.store.emoji + ' ' + esc(g.store.name) + ' — ' + fmt(g.total) + '</div>' +
              g.items.map(it => '<div style="display:flex;justify-content:space-between;font-size:12.5px;"><span>' + it.qty + '× ' + esc(it.p.title) + '</span><strong>' + fmt(it.p.price * it.qty) + '</strong></div>').join('')
            ).join('') +
            '<hr style="border:none;border-top:1px solid var(--border);"/>' +
            '<div class="summary-row"><span>Jemi töleg</span><span class="summary-total">' + fmt(totalSum) + '</span></div>' +
          '</div>' +
          '<form id="checkoutForm" class="form-card" novalidate>' +
            '<div class="field" id="fName"><label>Adyňyz we familiýaňyz *</label><input id="cName" value="' + esc(c.name || '') + '" placeholder="Merdan Ataýew" /><div class="err"></div></div>' +
            '<div class="field" id="fPhone"><label>Telefon (GSM) *</label><input id="cPhone" inputmode="tel" value="' + esc(c.phone || '') + '" placeholder="65 12 34 56" /><div class="err"></div></div>' +
            '<div class="field" id="fAddress"><label>Eltip bermek salgysy *</label><textarea id="cAddress" rows="2" placeholder="Etrapça, köçe, jaý, öý">' + esc(c.address || '') + '</textarea><div class="err"></div></div>' +
            '<div class="field"><label>Töleg görnüşi</label><div class="pay-row">' +
              '<button type="button" class="pay-opt' + (state.payMethod === 'cash' ? ' active' : '') + '" data-pay="cash">💵 Nagt</button>' +
              '<button type="button" class="pay-opt' + (state.payMethod === 'card' ? ' active' : '') + '" data-pay="card">💳 Kart (terminal)</button>' +
            '</div></div>' +
            '<div class="field"><label>Bellik (islege görä)</label><textarea id="cNote" rows="2" placeholder="Mysal: jaň etmäň, gapyny kakyň"></textarea></div>' +
            '<button type="submit" class="checkout-btn">🚀 Sargydy göni dükana iber</button>' +
          '</form>' +
        '</div>';
      }

      function renderOrders() {
        const myOrders = ALL_ORDERS.filter(o => state.myOrderCodes.includes(o.code));
        if (!myOrders.length) return '<div class="empty-box fade-in"><div style="font-size:44px;">📦</div><strong>Entek sargydyňyz ýok</strong><p style="font-size:12.5px;color:var(--sub);">Sargyt edeniňizde ýagdaýyny şu ýerden göni yzarlap bilersiňiz.</p><button type="button" class="primary-small-btn" data-go-stores="true">Dükanlara geç</button></div>';

        return '<div class="fade-in">' +
          '<div class="section-head" style="margin-top:2px;"><h2 class="section-title">Sargytlarym</h2><span style="font-size:11.5px;color:var(--accent2);font-weight:800;">● Göni yzarlama</span></div>' +
          myOrders.map(o => {
            const s = STORE_BY_ID[o.storeId] || { emoji:'🏪', name:o.storeName || 'Dükan', soft:'#f1f5f9', phone:'' };
            const sm = STATUS_META[o.status || 'new'] || STATUS_META.new;
            const dt = new Date(o.createdAt).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
            const segs = [1,2,3,4].map(n => '<div class="track-seg ' + (sm.step > n ? 'done' : (sm.step === n ? 'active' : '')) + '"></div>').join('');
            return '<div class="order-card">' +
              '<div class="order-head">' +
                '<div class="order-emoji" style="background:' + s.soft + ';">' + s.emoji + '</div>' +
                '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;">' + esc(s.name) + '</div><div style="font-size:11px;color:var(--sub);">' + esc(o.code) + ' • ' + dt + '</div></div>' +
                '<span class="order-status-pill ' + sm.cls + '">' + sm.label + '</span>' +
              '</div>' +
              (o.status !== 'cancelled' ? '<div class="track-bar">' + segs + '</div>' : '') +
              '<div class="order-items-box">' + o.items.map(it => it.qty + '× ' + esc(it.title)).join(' • ') + '<div style="margin-top:5px;font-weight:800;">Jemi: ' + fmt(o.total) + ' (' + (o.pay === 'card' ? 'Kart' : 'Nagt') + ')</div></div>' +
              '<div class="order-btns">' +
                (s.phone ? '<a class="oa-btn" href="tel:' + esc(s.phone.replace(/\s/g,'')) + '">📞 Jaň et</a>' : '') +
                '<button type="button" class="oa-btn dark" data-reorder="' + esc(o.code) + '">🛒 Gaýtadan sargyt</button>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }

      // ============================================================
      // 6. SUBMIT ORDER (STRICT STORE SPLITTING)
      // ============================================================
      function setErr(id, msg) {
        const w = $(id); if (!w) return;
        w.classList.toggle('invalid', !!msg);
        w.querySelector('.err').textContent = msg || '';
      }

      async function submitOrder() {
        const name = $('cName').value.trim();
        const phone = $('cPhone').value.trim();
        const address = $('cAddress').value.trim();
        const note = $('cNote').value.trim();
        let ok = true;
        if (name.length < 3) { setErr('fName', 'Adyňyzy ýazyň.'); ok = false; } else setErr('fName', '');
        if (phone.replace(/\D/g,'').length < 8) { setErr('fPhone', 'Dogry telefon belgisini ýazyň.'); ok = false; } else setErr('fPhone', '');
        if (address.length < 5) { setErr('fAddress', 'Doly salgyny ýazyň.'); ok = false; } else setErr('fAddress', '');
        if (!ok) return;

        const groups = cartGroups(state.checkoutStoreId);
        if (!groups.length) return;

        const created = groups.map(g => {
          const code = 'SM-' + Math.floor(100000 + Math.random() * 900000);
          return {
            code,
            storeId: g.store.id,
            storeName: g.store.name,
            status: 'new',
            createdAt: Date.now(),
            customerName: name,
            customerPhone: phone,
            address,
            note,
            pay: state.payMethod,
            items: g.items.map(it => ({ id: it.p.id, title: it.p.title, unit: it.p.unit, price: it.p.price, qty: it.qty })),
            total: g.total,
            count: g.count
          };
        });

        // Save to Supabase if configured
        if (sb) {
          for (const o of created) {
            await sb.from('orders').insert([{
              code: o.code, store_id: o.storeId, store_name: o.storeName, status: 'new',
              customer_name: o.customerName, customer_phone: o.customerPhone,
              address: o.address, note: o.note, pay_method: o.pay,
              items: o.items, total: o.total, count: o.count
            }]);
          }
        }

        // Save to shared local DB (so dukan.html sees it immediately!)
        ALL_ORDERS = loadJSON(DB_ORDERS_KEY, []);
        created.forEach(o => {
          ALL_ORDERS.unshift(o);
          state.myOrderCodes.unshift(o.code);
        });
        saveJSON(DB_ORDERS_KEY, ALL_ORDERS);
        saveJSON(MY_CODES_KEY, state.myOrderCodes);

        state.customer = { name, phone, address };
        saveJSON(CUSTOMER_KEY, state.customer);
        updateTopAddr();

        groups.forEach(g => g.items.forEach(it => delete state.cart[it.p.id]));
        saveJSON(CART_KEY, state.cart);

        renderBottomNav(); renderView(false);

        $('successSub').textContent = created.length > 1
          ? created.length + ' dükanyň hersine öz sargydy aýratyn ugradyldy.'
          : created[0].storeName + ' sargydyňyzy aldy. Ýagdaýyny göni yzarlap bilersiňiz.';
        $('successList').innerHTML = created.map(o =>
          '<div style="background:var(--soft);padding:10px 12px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;">' +
            '<div><div style="font-size:13px;font-weight:800;">' + esc(o.storeName) + '</div><div style="font-size:11px;color:var(--sub);">Kod: ' + o.code + '</div></div>' +
            '<strong style="color:var(--accent2);">' + fmt(o.total) + '</strong>' +
          '</div>'
        ).join('');
        $('successSheet').classList.add('open');
      }

      // ============================================================
      // 7. RENDER & PRODUCT SHEET
      // ============================================================
      function renderBottomNav() {
        const sum = cartSummary();
        const badge = $('navCartBadge');
        badge.textContent = sum.count;
        badge.classList.toggle('visible', sum.count > 0);

        const showFloat = sum.count > 0 && state.view !== 'cart' && state.view !== 'checkout';
        $('floatCartBtn').classList.toggle('visible', showFloat);
        if (showFloat) { $('fcCount').textContent = sum.count; $('fcTotal').textContent = fmt(sum.total) + ' →'; }

        document.querySelectorAll('.nav-btn').forEach(btn => {
          const t = btn.getAttribute('data-tab');
          const active = (t === 'home' && ['home','dept','search'].includes(state.view)) ||
            (t === 'stores' && ['stores','store'].includes(state.view)) ||
            (t === 'favorites' && state.view === 'favorites') ||
            (t === 'cart' && ['cart','checkout'].includes(state.view)) ||
            (t === 'orders' && state.view === 'orders');
          btn.classList.toggle('active', active);
        });
      }

      function renderView(scrollTop) {
        const map = { home:renderHome, stores:renderStoresTab, favorites:renderFavorites, dept:renderDept, store:renderStore, search:renderSearch, cart:renderCart, checkout:renderCheckout, orders:renderOrders };
        $('appView').innerHTML = (map[state.view] || renderHome)();
        if (scrollTop) window.scrollTo(0, 0);
      }

      function renderProductSheet(id) {
        const p = PRODUCT_BY_ID[id]; if (!p) return;
        const s = STORE_BY_ID[p.storeId] || { emoji:'🏪', name:'Dükan', soft:'#f1f5f9', eta:'30 min', rating:'4.8' };
        const qty = state.cart[p.id] || 0;
        const ctrl = p.inStock === false
          ? '<span style="color:var(--danger);font-weight:800;">Häzir gutardy</span>'
          : (qty === 0
            ? '<button type="button" class="checkout-btn" style="height:44px;" data-add="' + p.id + '">Sebede goş • ' + fmt(p.price) + '</button>'
            : '<div class="stepper" style="height:44px;padding:0 6px;gap:10px;"><button type="button" class="step-btn" style="width:34px;height:34px;" data-dec="' + p.id + '">−</button><span class="step-qty" style="font-size:15px;">' + qty + '</span><button type="button" class="step-btn plus" style="width:34px;height:34px;" data-inc="' + p.id + '">+</button></div>');

        $('productSheetBody').innerHTML =
          '<div class="sheet-handle"></div>' +
          '<div class="pd-thumb" style="background:linear-gradient(155deg,' + s.soft + ',#f8fafc);">' + p.emoji + '</div>' +
          '<div><h3 style="font-size:19px;font-weight:800;">' + esc(p.title) + '</h3><div style="font-size:12px;color:var(--sub);margin-top:2px;">' + esc(p.unit) + '</div></div>' +
          '<p style="font-size:13px;color:var(--sub);line-height:1.45;">' + esc(p.desc || 'Täze we ýokary hilli.') + '</p>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--soft);padding:10px 12px;border-radius:14px;cursor:pointer;" data-sheet-store="' + s.id + '">' +
            '<div style="display:flex;align-items:center;gap:9px;"><span style="font-size:22px;">' + s.emoji + '</span><div><div style="font-size:13px;font-weight:800;">' + esc(s.name) + '</div><div style="font-size:11px;color:var(--sub);">★ ' + esc(s.rating) + ' • 🚚 ' + esc(s.eta) + '</div></div></div>' +
            '<span style="font-size:12px;font-weight:800;color:var(--accent2);">Dükana geç →</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:6px;">' +
            '<div style="font-size:22px;font-weight:800;">' + fmt(p.price) + '</div>' +
            '<div style="flex:1;display:flex;justify-content:flex-end;">' + ctrl + '</div>' +
          '</div>';
      }

      // ============================================================
      // 8. EVENTS
      // ============================================================
      const searchInput = $('searchInput'), searchClearBtn = $('searchClearBtn');
      searchInput.addEventListener('input', e => {
        const v = e.target.value;
        searchClearBtn.classList.toggle('visible', v.trim().length > 0);
        if (v.trim().length > 0) {
          if (state.view !== 'search') { stack.push({ v: state.view, id: state.activeId }); state.view = 'search'; }
          state.searchQuery = v; renderBottomNav(); renderView(false);
        } else if (state.view === 'search') { state.searchQuery = ''; back(); }
      });
      searchClearBtn.addEventListener('click', () => { searchInput.value = ''; searchClearBtn.classList.remove('visible'); if (state.view === 'search') back(); });

      $('brandHomeBtn').addEventListener('click', () => goTab('home'));
      $('floatCartBtn').addEventListener('click', () => goTab('cart'));
      document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => goTab(b.getAttribute('data-tab'))));

      $('topAddrBtn').addEventListener('click', () => {
        $('aName').value = state.customer.name || '';
        $('aPhone').value = state.customer.phone || '';
        $('aAddress').value = state.customer.address || '';
        $('addrSheet').classList.add('open');
      });
      $('saveAddrBtn').addEventListener('click', () => {
        state.customer = { name:$('aName').value.trim(), phone:$('aPhone').value.trim(), address:$('aAddress').value.trim() };
        saveJSON(CUSTOMER_KEY, state.customer); updateTopAddr();
        $('addrSheet').classList.remove('open'); toast('Salgy saklandy ✓');
        if (state.view === 'checkout') renderView(false);
      });
      $('closeAddrBtn').addEventListener('click', () => $('addrSheet').classList.remove('open'));
      $('addrSheet').addEventListener('click', e => { if (e.target.id === 'addrSheet') $('addrSheet').classList.remove('open'); });
      $('goOrdersAfterBtn').addEventListener('click', () => { $('successSheet').classList.remove('open'); goTab('orders'); });
      $('successSheet').addEventListener('click', e => { if (e.target.id === 'successSheet') { $('successSheet').classList.remove('open'); goTab('orders'); } });

      $('productSheetBody').addEventListener('click', e => {
        const el = sel => e.target.closest(sel);
        if (el('[data-add]')) { updateQty(el('[data-add]').getAttribute('data-add'), 1); return; }
        if (el('[data-inc]')) { updateQty(el('[data-inc]').getAttribute('data-inc'), 1); return; }
        if (el('[data-dec]')) { updateQty(el('[data-dec]').getAttribute('data-dec'), -1); return; }
        if (el('[data-sheet-store]')) { $('productSheet').classList.remove('open'); go('store', el('[data-sheet-store]').getAttribute('data-sheet-store')); }
      });
      $('productSheet').addEventListener('click', e => { if (e.target.id === 'productSheet') $('productSheet').classList.remove('open'); });

      $('appView').addEventListener('submit', e => { if (e.target.id === 'checkoutForm') { e.preventDefault(); submitOrder(); } });
      $('appView').addEventListener('input', e => {
        if (e.target.id === 'storeSearchInput') {
          state.storeSearch = e.target.value; const pos = e.target.selectionStart; renderView(false);
          const inp = $('storeSearchInput'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
        }
      });

      $('appView').addEventListener('click', e => {
        const el = sel => e.target.closest(sel);
        if (el('[data-fav]')) { e.stopPropagation(); toggleFav(el('[data-fav]').getAttribute('data-fav')); return; }
        if (el('[data-add]')) { updateQty(el('[data-add]').getAttribute('data-add'), 1); return; }
        if (el('[data-inc]')) { updateQty(el('[data-inc]').getAttribute('data-inc'), 1); return; }
        if (el('[data-dec]')) { updateQty(el('[data-dec]').getAttribute('data-dec'), -1); return; }
        if (el('[data-open-prod]')) { state.activeProductId = el('[data-open-prod]').getAttribute('data-open-prod'); renderProductSheet(state.activeProductId); $('productSheet').classList.add('open'); return; }
        if (el('[data-open-dept]')) { go('dept', el('[data-open-dept]').getAttribute('data-open-dept')); return; }
        if (el('[data-open-type]')) { state.storeTypeFilter = el('[data-open-type]').getAttribute('data-open-type'); state.storeFilter = 'all'; goTab('stores'); return; }
        if (el('[data-open-store]')) { go('store', el('[data-open-store]').getAttribute('data-open-store')); return; }
        if (el('[data-type-filter]')) { state.storeTypeFilter = el('[data-type-filter]').getAttribute('data-type-filter'); renderView(false); return; }
        if (el('[data-filter]')) { state.storeFilter = el('[data-filter]').getAttribute('data-filter'); renderView(false); return; }
        if (el('[data-reset-filters]')) { state.storeTypeFilter = 'all'; state.storeFilter = 'all'; renderView(false); return; }
        if (el('[data-store-cat]')) { state.storeCatFilter = el('[data-store-cat]').getAttribute('data-store-cat'); renderView(false); return; }
        if (el('[data-pay]')) { state.payMethod = el('[data-pay]').getAttribute('data-pay'); renderView(false); return; }
        if (el('[data-back]')) { back(); return; }
        if (el('[data-go-stores]')) { state.storeTypeFilter = 'all'; state.storeFilter = 'all'; goTab('stores'); return; }
        if (el('[data-checkout-store]')) { state.checkoutStoreId = el('[data-checkout-store]').getAttribute('data-checkout-store'); go('checkout'); return; }
        if (el('[data-checkout-all]')) { state.checkoutStoreId = null; go('checkout'); return; }
        if (el('[data-cart-clear]')) { if (confirm('Sebet boşadylsynmy?')) { state.cart = {}; saveJSON(CART_KEY, {}); renderBottomNav(); renderView(false); } return; }
        if (el('[data-reorder]')) {
          const o = ALL_ORDERS.find(x => x.code === el('[data-reorder]').getAttribute('data-reorder'));
          if (o) { o.items.forEach(it => { if (PRODUCT_BY_ID[it.id]) state.cart[it.id] = (state.cart[it.id] || 0) + it.qty; }); saveJSON(CART_KEY, state.cart); toast('Sebede goşuldy ✓'); goTab('cart'); }
        }
      });

      updateTopAddr();
      renderBottomNav();
      renderView(true);
      syncFromSupabase();
    })();
  </script>
</body>
</html>

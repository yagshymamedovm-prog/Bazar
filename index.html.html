            }).join('') + '</div></div>' : '') +
          '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--soft);padding:10px 12px;border-radius:14px;cursor:pointer;" data-sheet-store="' + s.id + '">' +
            '<div><strong style="font-size:13px;">' + s.emoji + ' ' + esc(s.name) + '</strong><div style="font-size:11px;color:var(--sub);">★ ' + esc(storeRatingText(s.id, s.rating)) + ' • ' + esc(s.eta) + '</div></div>' +
            '<span style="font-size:12px;font-weight:800;color:var(--accent2);">Dükana geç →</span>' +
          '</div>' +
          '<button type="button" class="checkout-btn" id="pdAddBtn">Sebede goş • ' + fmt(unitP) + '</button>';
      }

      function renderAddrSheet() {
        $('savedAddrList').innerHTML = state.addresses.length ? state.addresses.map(a =>
          '<div class="addr-card' + (a.active ? ' active' : '') + '" data-pick-addr="' + a.id + '">' +
            '<div style="min-width:0;flex:1;"><strong style="font-size:13px;">' + esc(a.label) + (a.lat ? ' 🛰️' : '') + '</strong><div style="font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(a.address) + '</div></div>' +
            '<button type="button" data-del-addr="' + a.id + '" style="border:none;background:none;color:var(--danger);font-weight:800;cursor:pointer;padding:4px;">✕</button>' +
          '</div>'
        ).join('') : '<div style="font-size:12px;color:var(--sub);">Entek ýatda saklanan salgy ýok.</div>';
      }

      function renderBottomNav() {
        const sum = cartSummary();
        const badge = $('navCartBadge');
        badge.textContent = sum.count;
        badge.classList.toggle('visible', sum.count > 0);
        const showFloat = sum.count > 0 && state.view !== 'cart' && state.view !== 'checkout';
        $('floatCartBtn').classList.toggle('visible', showFloat);
        if (showFloat) { $('fcCount').textContent = sum.count; $('fcTotal').textContent = fmt(sum.total) + ' →'; }
        document.querySelectorAll('.nav-btn').forEach(btn => {
          const tab = btn.getAttribute('data-tab');
          const active = (tab === 'home' && ['home','dept','search'].includes(state.view)) ||
            (tab === 'stores' && ['stores','store'].includes(state.view)) ||
            (tab === 'favorites' && state.view === 'favorites') ||
            (tab === 'cart' && ['cart','checkout'].includes(state.view)) ||
            (tab === 'orders' && state.view === 'orders');
          btn.classList.toggle('active', active);
        });
      }

      function renderView(scrollTop) {
        const map = { home:renderHome, stores:renderStoresTab, favorites:renderFavorites, dept:renderDept, store:renderStore, search:renderSearch, cart:renderCart, checkout:renderCheckout, orders:renderOrders };
        $('appView').innerHTML = (map[state.view] || renderHome)();
        if (scrollTop) window.scrollTo(0, 0);
      }

      // ===== EVENTS =====
      $('langBtn').addEventListener('click', () => {
        const order = ['tk','ru','tr'];
        state.lang = order[(order.indexOf(state.lang) + 1) % order.length];
        localStorage.setItem(LANG_KEY, state.lang);
        
      // v7 Extra Handlers (Theme, Voice Search, City, Compare, Support Ticket, Store Apply)
      $('themeBtn').addEventListener('click', () => {
        state.dark = !state.dark; document.body.classList.toggle('dark', state.dark);
        localStorage.setItem('sm_dark_v7', state.dark ? '1' : '0');
        $('themeBtn').textContent = state.dark ? '☀️' : '🌙';
      });
      $('themeBtn').textContent = state.dark ? '☀️' : '🌙';

      $('voiceBtn').addEventListener('click', () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { toast('Bu brauzerde sesli gözleg ýok'); return; }
        const rec = new SR(); rec.lang = state.lang === 'ru' ? 'ru-RU' : 'tr-TR';
        toast('🎙️ Gepläň...');
        rec.onresult = e => {
          const txt = e.results[0][0].transcript;
          searchInput.value = txt; searchInput.dispatchEvent(new Event('input'));
        };
        rec.start();
      });

      $('closeTicketBtn').addEventListener('click', () => $('ticketSheet').classList.remove('open'));
      $('submitTicketBtn').addEventListener('click', async () => {
        const msg = $('tkMsg').value.trim(); if (!msg) { toast('Meseläni ýazyň'); return; }
        const code = $('tkOrderCode').value;
        const o = ALL_ORDERS.find(x => x.code === code) || {};
        if (sb) await sb.from('support_tickets').insert([{ order_code:code, store_id:o.storeId||'', customer_name:o.customerName||'Müşderi', customer_phone:o.customerPhone||'', message:msg }]);
        $('tkMsg').value = ''; $('ticketSheet').classList.remove('open'); toast('Goldaw bileti iberildi ✓');
      });

      $('closeCompareBtn').addEventListener('click', () => $('compareSheet').classList.remove('open'));
      $('closeApplyBtn').addEventListener('click', () => $('applySheet').classList.remove('open'));
      $('submitApplyBtn').addEventListener('click', async () => {
        const nm = $('apName').value.trim(), em = $('apEmail').value.trim(), ph = $('apPhone').value.trim(), ct = $('apCity').value;
        if (!nm || !em || !ph) { toast('Ähli meýdanlary dolduryň'); return; }
        if (sb) await sb.from('store_applications').insert([{ store_name:nm, owner_email:em, phone:ph, city:ct, status:'pending' }]);
        $('applySheet').classList.remove('open'); toast('Ýüz tutmaňyz kabul edildi! Admin tassyklamasyna garaşylýar ✓');
      });

      $('appView').addEventListener('click', e => {
        const el = s => e.target.closest(s);
        if (el('#cycleCityBtn')) { const cs=['Aşgabat','Mary','Türkmenabat','Balkanabat','Daşoguz']; state.city=cs[(cs.indexOf(state.city)+1)%cs.length]; localStorage.setItem('sm_city_v7',state.city); toast('Şäher: '+state.city); renderView(false); return; }
        if (el('#nightFilterBtn')) { state.nightOnly=!state.nightOnly; toast(state.nightOnly?'🌙 Gije açyk dükanlar':'Ähli dükanlar'); renderView(false); return; }
        if (el('#copyRefBtn')) { navigator.clipboard?.writeText(state.refCode); toast('Dost çagyryş kody göçürildi: '+state.refCode+' (+15 m.)'); return; }
        if (el('#openApplyBtn')) { $('applySheet').classList.add('open'); return; }
        if (el('#openCompareBtn')) {
          const staples = PRODUCTS.filter(p => /süt|suw|çörek|ýumurtga|alma|palaw/i.test(p.title)).sort((a,b)=>a.price-b.price);
          $('compareList').innerHTML = staples.map(p => { const s=STORE_BY_ID[p.storeId]||{name:'Dükan'}; return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--soft);border-radius:11px;"><div><b>'+esc(p.title)+'</b><div style="font-size:11px;color:var(--sub);">'+esc(s.name)+' • '+esc(p.unit)+'</div></div><strong style="color:var(--accent2);">'+fmt(p.price)+'</strong></div>'; }).join('');
          $('compareSheet').classList.add('open'); return;
        }
        if (el('[data-otype]')) { state.orderType = el('[data-otype]').getAttribute('data-otype'); renderView(false); return; }
        if (el('[data-tip]')) { state.courierTip = Number(el('[data-tip]').getAttribute('data-tip')); renderView(false); return; }
        if (el('#cContactless')) { state.contactless = el('#cContactless').checked; return; }
        if (el('#cDeposit')) { state.needDeposit = el('#cDeposit').checked; renderView(false); return; }
        if (el('[data-ticket]')) { $('tkOrderCode').value = el('[data-ticket]').getAttribute('data-ticket'); $('ticketSheet').classList.add('open'); return; }
      });

      applyLangUI(); renderView(false);
        toast('Dil: ' + state.lang.toUpperCase());
      });

      const searchInput = $('searchInput'), searchClearBtn = $('searchClearBtn');
      searchInput.addEventListener('input', e => {
        const v = e.target.value; searchClearBtn.classList.toggle('visible', v.trim().length > 0);
        if (v.trim().length > 0) { if (state.view !== 'search') { stack.push({ v: state.view, id: state.activeId }); state.view = 'search'; } state.searchQuery = v; renderBottomNav(); renderView(false); }
        else if (state.view === 'search') { state.searchQuery = ''; back(); }
      });
      searchClearBtn.addEventListener('click', () => { searchInput.value = ''; searchClearBtn.classList.remove('visible'); if (state.view === 'search') back(); });

      $('brandHomeBtn').addEventListener('click', () => goTab('home'));
      $('floatCartBtn').addEventListener('click', () => goTab('cart'));
      document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => goTab(b.getAttribute('data-tab'))));

      // Multi-Address Sheet Events
      $('topAddrBtn').addEventListener('click', () => { renderAddrSheet(); $('addrSheet').classList.add('open'); });
      $('closeAddrBtn').addEventListener('click', () => $('addrSheet').classList.remove('open'));
      $('addrSheet').addEventListener('click', e => {
        if (e.target.id === 'addrSheet') { $('addrSheet').classList.remove('open'); return; }
        const lb = e.target.closest('[data-alabel]');
        if (lb) {
          state.newAddrLabel = lb.getAttribute('data-alabel');
          $('addrSheet').querySelectorAll('[data-alabel]').forEach(x => x.classList.toggle('active', x === lb));
          return;
        }
        const del = e.target.closest('[data-del-addr]');
        if (del) {
          e.stopPropagation();
          state.addresses = state.addresses.filter(x => x.id !== del.getAttribute('data-del-addr'));
          saveJSON(ADDRS_KEY, state.addresses); updateTopAddr(); renderAddrSheet(); return;
        }
        const pk = e.target.closest('[data-pick-addr]');
        if (pk) {
          const id = pk.getAttribute('data-pick-addr');
          state.addresses.forEach(x => x.active = (x.id === id));
          saveJSON(ADDRS_KEY, state.addresses); updateTopAddr(); $('addrSheet').classList.remove('open');
          if (state.view === 'checkout') renderView(false);
        }
      });

      function grabGps(cb) {
        if (!navigator.geolocation) { toast('GPS goldanylmaýar'); return; }
        toast('GPS kesgitlenýär...');
        navigator.geolocation.getCurrentPosition(
          pos => { state.newAddrCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }; toast('GPS konumy alyndy ✓'); if (cb) cb(); },
          () => toast('GPS rugsady berilmedi')
        );
      }
      $('addrGpsBtn').addEventListener('click', () => grabGps(() => { $('addrGpsBtn').textContent = '✅ GPS konumy alyndy'; }));
      $('saveAddrBtn').addEventListener('click', () => {
        const address = $('aAddress').value.trim();
        if (address.length < 3) { toast('Salgyny ýazyň'); return; }
        state.addresses.forEach(x => x.active = false);
        state.addresses.unshift({
          id: 'a_' + Date.now(), label: state.newAddrLabel,
          name: $('aName').value.trim(), phone: $('aPhone').value.trim(), address,
          lat: state.newAddrCoords ? state.newAddrCoords.lat : null,
          lng: state.newAddrCoords ? state.newAddrCoords.lng : null, active: true
        });
        saveJSON(ADDRS_KEY, state.addresses); updateTopAddr();
        $('aAddress').value = ''; state.newAddrCoords = null;
        $('addrSheet').classList.remove('open'); toast('Salgy saklandy ✓');
        if (state.view === 'checkout') renderView(false);
      });

      // Product Sheet Events
      $('productSheetBody').addEventListener('click', e => {
        const to = e.target.closest('[data-toggle-opt]');
        if (to) {
          const p = PRODUCT_BY_ID[state.activeProductId];
          const opt = p.options[+to.getAttribute('data-toggle-opt')];
          if (state.selectedOpts.some(x => x.name === opt.name)) state.selectedOpts = state.selectedOpts.filter(x => x.name !== opt.name);
          else state.selectedOpts.push(opt);
          renderProductSheet(state.activeProductId); return;
        }
        if (e.target.id === 'pdAddBtn') {
          addToCart(state.activeProductId, [...state.selectedOpts], 1);
          $('productSheet').classList.remove('open'); toast('Sebede goşuldy ✓'); return;
        }
        const gs = e.target.closest('[data-sheet-store]');
        if (gs) { $('productSheet').classList.remove('open'); go('store', gs.getAttribute('data-sheet-store')); }
      });
      $('productSheet').addEventListener('click', e => { if (e.target.id === 'productSheet') $('productSheet').classList.remove('open'); });

      // Rating Sheet Events
      $('starsPick').addEventListener('click', e => {
        const b = e.target.closest('[data-star]'); if (!b) return;
        state.rateStars = +b.getAttribute('data-star');
        $('starsPick').querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.getAttribute('data-star') <= state.rateStars));
      });
      $('closeRateBtn').addEventListener('click', () => $('rateSheet').classList.remove('open'));
      $('submitRateBtn').addEventListener('click', async () => {
        const o = ALL_ORDERS.find(x => x.code === state.rateOrderCode); if (!o) return;
        const rev = { id: Date.now(), orderCode: o.code, storeId: o.storeId, customerName: o.customerName, rating: state.rateStars, comment: $('rateComment').value.trim(), reply: '', createdAt: Date.now() };
        REVIEWS.unshift(rev); saveJSON(DB_REVIEWS_KEY, REVIEWS);
        o.rated = true; saveJSON(DB_ORDERS_KEY, ALL_ORDERS);
        if (sb) {
          await sb.from('reviews').insert([{ order_code:rev.orderCode, store_id:rev.storeId, customer_name:rev.customerName, rating:rev.rating, comment:rev.comment }]);
          await sb.from('orders').update({ rated: true }).eq('code', o.code);
        }
        $('rateSheet').classList.remove('open'); $('rateComment').value = '';
        toast('Bahaňyz üçin sag boluň! ⭐'); renderView(false);
      });

      $('goOrdersAfterBtn').addEventListener('click', () => { $('successSheet').classList.remove('open'); goTab('orders'); });
      $('successSheet').addEventListener('click', e => { if (e.target.id === 'successSheet') { $('successSheet').classList.remove('open'); goTab('orders'); } });

      // Main View Delegated Events
      $('appView').addEventListener('submit', e => { if (e.target.id === 'checkoutForm') { e.preventDefault(); submitOrder(); } });
      $('appView').addEventListener('input', e => {
        if (e.target.id === 'storeSearchInput') {
          state.storeSearch = e.target.value; const pos = e.target.selectionStart; renderView(false);
          const inp = $('storeSearchInput'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
        }
      });

      $('appView').addEventListener('click', e => {
        const el = sel => e.target.closest(sel);
        if (el('[data-fav]')) { e.stopPropagation(); const sid = el('[data-fav]').getAttribute('data-fav'); state.favs = state.favs.includes(sid) ? state.favs.filter(x => x !== sid) : [...state.favs, sid]; saveJSON(FAV_KEY, state.favs); renderView(false); return; }
        if (el('[data-copy-coupon]')) { const c = el('[data-copy-coupon]').getAttribute('data-copy-coupon'); navigator.clipboard?.writeText(c); toast('Kupon göçürildi: ' + c); return; }
        if (el('[data-quick-add]')) { addToCart(el('[data-quick-add]').getAttribute('data-quick-add'), [], 1); return; }
        if (el('[data-quick-dec]')) { addToCart(el('[data-quick-dec]').getAttribute('data-quick-dec'), [], -1); return; }
        if (el('[data-line-inc]')) { updateLineQty(el('[data-line-inc]').getAttribute('data-line-inc'), 1); return; }
        if (el('[data-line-dec]')) { updateLineQty(el('[data-line-dec]').getAttribute('data-line-dec'), -1); return; }
        if (el('[data-open-prod]')) { state.activeProductId = el('[data-open-prod]').getAttribute('data-open-prod'); state.selectedOpts = []; renderProductSheet(state.activeProductId); $('productSheet').classList.add('open'); return; }
        if (el('[data-open-dept]')) { go('dept', el('[data-open-dept]').getAttribute('data-open-dept')); return; }
        if (el('[data-open-type]')) { state.storeTypeFilter = el('[data-open-type]').getAttribute('data-open-type'); state.storeFilter = 'all'; goTab('stores'); return; }
        if (el('[data-open-store]')) { go('store', el('[data-open-store]').getAttribute('data-open-store')); return; }
        if (el('[data-type-filter]')) { state.storeTypeFilter = el('[data-type-filter]').getAttribute('data-type-filter'); renderView(false); return; }
        if (el('[data-filter]')) { state.storeFilter = el('[data-filter]').getAttribute('data-filter'); renderView(false); return; }
        if (el('[data-reset-filters]')) { state.storeTypeFilter = 'all'; state.storeFilter = 'all'; renderView(false); return; }
        if (el('[data-store-cat]')) { state.storeCatFilter = el('[data-store-cat]').getAttribute('data-store-cat'); renderView(false); return; }
        if (el('[data-store-tab]')) { state.storeTab = el('[data-store-tab]').getAttribute('data-store-tab'); renderView(false); return; }
        if (el('[data-pay]')) { state.payMethod = el('[data-pay]').getAttribute('data-pay'); renderView(false); return; }
        if (el('#checkoutGpsBtn')) { grabGps(() => renderView(false)); return; }
        if (el('#applyCouponBtn')) {
          const code = ($('couponInput').value || '').trim().toUpperCase();
          const cp = COUPONS.find(x => x.code.toUpperCase() === code && x.active !== false);
          if (!cp) { toast('Nädogry kupon kody'); return; }
          state.appliedCoupon = cp; toast('Kupon ulanyldy: -' + cp.percent + '% 🎉'); renderView(false); return;
        }
        if (el('#removeCouponBtn')) { state.appliedCoupon = null; renderView(false); return; }
        if (el('[data-rate-order]')) {
          const o = ALL_ORDERS.find(x => x.code === el('[data-rate-order]').getAttribute('data-rate-order'));
          if (o) { state.rateOrderCode = o.code; state.rateStars = 5; $('rateStoreName').textContent = o.storeName + ' (' + o.code + ')'; $('rateSheet').classList.add('open'); }
          return;
        }
        if (el('[data-back]')) { back(); return; }
        if (el('[data-go-stores]')) { state.storeTypeFilter = 'all'; state.storeFilter = 'all'; goTab('stores'); return; }
        if (el('[data-checkout-all]')) { state.checkoutStoreId = null; go('checkout'); return; }
        if (el('[data-cart-clear]')) { if (confirm('Sebet boşadylsynmy?')) { state.cart = {}; state.appliedCoupon = null; saveJSON(CART_KEY, {}); renderBottomNav(); renderView(false); } return; }
        if (el('[data-reorder]')) {
          const o = ALL_ORDERS.find(x => x.code === el('[data-reorder]').getAttribute('data-reorder'));
          if (o) { o.items.forEach(it => { if (PRODUCT_BY_ID[it.id]) addToCart(it.id, it.options || [], it.qty); }); toast('Sebede goşuldy ✓'); goTab('cart'); }
        }
      });

      
      // v7 Extra Handlers (Theme, Voice Search, City, Compare, Support Ticket, Store Apply)
      $('themeBtn').addEventListener('click', () => {
        state.dark = !state.dark; document.body.classList.toggle('dark', state.dark);
        localStorage.setItem('sm_dark_v7', state.dark ? '1' : '0');
        $('themeBtn').textContent = state.dark ? '☀️' : '🌙';
      });
      $('themeBtn').textContent = state.dark ? '☀️' : '🌙';

      $('voiceBtn').addEventListener('click', () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { toast('Bu brauzerde sesli gözleg ýok'); return; }
        const rec = new SR(); rec.lang = state.lang === 'ru' ? 'ru-RU' : 'tr-TR';
        toast('🎙️ Gepläň...');
        rec.onresult = e => {
          const txt = e.results[0][0].transcript;
          searchInput.value = txt; searchInput.dispatchEvent(new Event('input'));
        };
        rec.start();
      });

      $('closeTicketBtn').addEventListener('click', () => $('ticketSheet').classList.remove('open'));
      $('submitTicketBtn').addEventListener('click', async () => {
        const msg = $('tkMsg').value.trim(); if (!msg) { toast('Meseläni ýazyň'); return; }
        const code = $('tkOrderCode').value;
        const o = ALL_ORDERS.find(x => x.code === code) || {};
        if (sb) await sb.from('support_tickets').insert([{ order_code:code, store_id:o.storeId||'', customer_name:o.customerName||'Müşderi', customer_phone:o.customerPhone||'', message:msg }]);
        $('tkMsg').value = ''; $('ticketSheet').classList.remove('open'); toast('Goldaw bileti iberildi ✓');
      });

      $('closeCompareBtn').addEventListener('click', () => $('compareSheet').classList.remove('open'));
      $('closeApplyBtn').addEventListener('click', () => $('applySheet').classList.remove('open'));
      $('submitApplyBtn').addEventListener('click', async () => {
        const nm = $('apName').value.trim(), em = $('apEmail').value.trim(), ph = $('apPhone').value.trim(), ct = $('apCity').value;
        if (!nm || !em || !ph) { toast('Ähli meýdanlary dolduryň'); return; }
        if (sb) await sb.from('store_applications').insert([{ store_name:nm, owner_email:em, phone:ph, city:ct, status:'pending' }]);
        $('applySheet').classList.remove('open'); toast('Ýüz tutmaňyz kabul edildi! Admin tassyklamasyna garaşylýar ✓');
      });

      $('appView').addEventListener('click', e => {
        const el = s => e.target.closest(s);
        if (el('#cycleCityBtn')) { const cs=['Aşgabat','Mary','Türkmenabat','Balkanabat','Daşoguz']; state.city=cs[(cs.indexOf(state.city)+1)%cs.length]; localStorage.setItem('sm_city_v7',state.city); toast('Şäher: '+state.city); renderView(false); return; }
        if (el('#nightFilterBtn')) { state.nightOnly=!state.nightOnly; toast(state.nightOnly?'🌙 Gije açyk dükanlar':'Ähli dükanlar'); renderView(false); return; }
        if (el('#copyRefBtn')) { navigator.clipboard?.writeText(state.refCode); toast('Dost çagyryş kody göçürildi: '+state.refCode+' (+15 m.)'); return; }
        if (el('#openApplyBtn')) { $('applySheet').classList.add('open'); return; }
        if (el('#openCompareBtn')) {
          const staples = PRODUCTS.filter(p => /süt|suw|çörek|ýumurtga|alma|palaw/i.test(p.title)).sort((a,b)=>a.price-b.price);
          $('compareList').innerHTML = staples.map(p => { const s=STORE_BY_ID[p.storeId]||{name:'Dükan'}; return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--soft);border-radius:11px;"><div><b>'+esc(p.title)+'</b><div style="font-size:11px;color:var(--sub);">'+esc(s.name)+' • '+esc(p.unit)+'</div></div><strong style="color:var(--accent2);">'+fmt(p.price)+'</strong></div>'; }).join('');
          $('compareSheet').classList.add('open'); return;
        }
        if (el('[data-otype]')) { state.orderType = el('[data-otype]').getAttribute('data-otype'); renderView(false); return; }
        if (el('[data-tip]')) { state.courierTip = Number(el('[data-tip]').getAttribute('data-tip')); renderView(false); return; }
        if (el('#cContactless')) { state.contactless = el('#cContactless').checked; return; }
        if (el('#cDeposit')) { state.needDeposit = el('#cDeposit').checked; renderView(false); return; }
        if (el('[data-ticket]')) { $('tkOrderCode').value = el('[data-ticket]').getAttribute('data-ticket'); $('ticketSheet').classList.add('open'); return; }
      });

      applyLangUI();
      updateTopAddr();
      renderBottomNav();
      renderView(true);
      syncFromSupabase();
      startRealtime();
    })();
  </script>
</body>
</html>
